<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi primer maqueta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Tipografías del menú compartido -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/menu.css">

    <style>

        .seccion-img {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .ilustracion {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }


        .caja2 {
            padding: 0;
            background-color: #939683;
        }

        .banner {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: left center;
        }

        .caja3 {
            min-height: 300px;
            background-color: #858C5E;
        }

        .caja4 {
            height: 300px;
            background-color: #BBC97D;
        }

        .caja5 {
            height: 300px;
            background-color: #96A84A;
        }

        .caja6 {
            height: 300px;
            background-color: #464F23;
        }

        .caja7 {
            height: 300px;
            background-color: #262B0A;
        }

        .caja8 {
            height: 300px;
            background-color: #637309;
        }

        .caja9 {
            height: 300px;
            background-color: #9DAB4B;
        }

        .caja10 {
            height: 300px;
            background-color: #D8EB67;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- MENÚ (igual en todas las páginas; estilos en css/menu.css) -->
            <!-- celular y tablet: botón hamburguesa | escritorio: botones en fila -->
            <nav class="col-12 navbar navbar-expand-xl menu" data-bs-theme="dark">
                <a class="navbar-brand menu-marca" href="index.html">CSS FÁCIL</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar u ocultar el menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <div class="navbar-nav ms-auto gap-2">
                        <a class="nav-link active" aria-current="page" href="index.html">
                            <img src="img/icono-estructura.svg" alt="" class="menu-icono">Estructura y sintaxis
                        </a>
                        <a class="nav-link" href="especificidad/index.html">
                            <img src="img/icono-especificidad.svg" alt="" class="menu-icono">Niveles de especificidad
                        </a>
                        <a class="nav-link" href="pseudoclases/index.html">
                            <img src="img/icono-pseudoclases.svg" alt="" class="menu-icono">Pseudoclases y elementos
                        </a>
                        <a class="nav-link" href="box-model/index.html">
                            <img src="img/icono-boxmodel.svg" alt="" class="menu-icono">Box model
                        </a>
                    </div>
                </div>
            </nav>
            <header class="col-12 col-sm-12 col-md-10 col-lg-10 col-xl-12 col-xxl-12 caja2">
                <img src="img/banner-css-facil.jpg" alt="CSS fácil: aprende paso a paso, diseño web para todos" class="banner">
            </header>
            <aside class="col-6 col-sm-6 col-md-2 col-lg-2 col-xl-4 col-xxl-4 caja3">caja 3</aside>
            <section class="col-6 col-sm-6 col-md-2 col-lg-2 col-xl-4 col-xxl-4 caja4 seccion-img">
                <img src="img/css-facil-color.svg" alt="CSS fácil: cambia el color de un texto" class="ilustracion">
            </section>
            <aside class="col-6 col-sm-6 col-md-10 col-lg-10 col-xl-4 col-xxl-4 caja5">caja 5</aside>
            <section class="col-6 col-sm-6 col-md-12 col-lg-12 col-xl-3 col-xxl-3 caja6 seccion-img">
                <img src="img/css-facil-tamano.svg" alt="CSS fácil: cambia el tamaño de la letra" class="ilustracion">
            </section>
            <section class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-2 col-xxl-2 caja7 seccion-img">
                <img src="img/css-facil-pincel.svg" alt="CSS fácil: el pincel de tu página web" class="ilustracion">
            </section>
            <section class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-7 col-xxl-7 caja8 seccion-img">
                <img src="img/css-facil-flexbox.svg" alt="CSS fácil: ordena cajas con flexbox" class="ilustracion">
            </section>
            <section class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-5 col-xxl-5 caja9 seccion-img">
                <img src="img/css-facil-bordes.svg" alt="CSS fácil: bordes redondeados y sombras" class="ilustracion">
            </section>
            <footer class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-7 col-xxl-7 caja10">caja 10</footer>
        </div>

    </div>
    <!-- Bootstrap: el JavaScript que hace funcionar el botón hamburguesa -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
