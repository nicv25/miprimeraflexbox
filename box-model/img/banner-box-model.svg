<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 893" role="img" aria-label="Box model: todo en la web es una caja">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3113"/>
      <stop offset="1" stop-color="#161905"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="suave" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <rect width="1600" height="893" fill="url(#fondo)"/>
  <g filter="url(#suave)" opacity=".35">
    <circle cx="1150" cy="420" r="300" fill="#96A84A"/>
    <circle cx="200" cy="780" r="200" fill="#F2BFA0"/>
    <circle cx="300" cy="120" r="160" fill="#C9D8EE"/>
  </g>

  <!-- cuadrícula suave de fondo -->
  <g stroke="#3E4A1C" stroke-width="2" opacity=".6">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600"/>
    <path d="M200 0 V893 M400 0 V893 M600 0 V893 M800 0 V893 M1000 0 V893 M1200 0 V893 M1400 0 V893"/>
  </g>

  <!-- TÍTULO -->
  <g font-family="Quicksand, Nunito, Arial Rounded MT Bold, Arial, sans-serif" font-weight="700">
    <text x="110" y="250" font-size="40" letter-spacing="10" fill="#BBC97D">CSS FÁCIL</text>
    <text x="104" y="400" font-size="150" fill="#F7DDB0">BOX</text>
    <text x="104" y="545" font-size="150" fill="#D8EB67">MODEL</text>
    <text x="110" y="630" font-size="44" fill="#FBF8F3" font-family="Nunito, Arial, sans-serif" font-weight="600">Todo en la web es una caja</text>
  </g>
  <g transform="translate(110 680)">
    <rect width="130" height="16" rx="8" fill="#F2BFA0"/>
    <rect x="145" width="90" height="16" rx="8" fill="#E6B85C"/>
    <rect x="250" width="110" height="16" rx="8" fill="#D8EB67"/>
    <rect x="375" width="70" height="16" rx="8" fill="#C9D8EE"/>
  </g>

  <!-- CAJAS ANIDADAS (margin, border, padding, contenido) -->
  <g transform="translate(860 170) rotate(-4 330 270)" filter="url(#sombra)">
    <rect width="660" height="540" rx="36" fill="#F2BFA0"/>
    <rect x="70" y="70" width="520" height="400" rx="28" fill="#E6B85C"/>
    <rect x="88" y="88" width="484" height="364" rx="22" fill="#D8EB67"/>
    <rect x="168" y="168" width="324" height="204" rx="16" fill="#C9D8EE"/>
    <!-- contenido: líneas de texto -->
    <rect x="208" y="214" width="220" height="22" rx="11" fill="#FBF8F3"/>
    <rect x="208" y="256" width="244" height="16" rx="8" fill="#FBF8F3" opacity=".8"/>
    <rect x="208" y="288" width="180" height="16" rx="8" fill="#FBF8F3" opacity=".8"/>
    <rect x="208" y="320" width="100" height="28" rx="14" fill="#464F23"/>
    <!-- flechas de medida -->
    <path d="M330 92 v72 M318 106 l12 -14 12 14 M318 150 l12 14 12 -14" fill="none" stroke="#464F23" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M330 6 v60 M318 20 l12 -14 12 14 M318 52 l12 14 12 -14" fill="none" stroke="#7A4A2E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- piezas flotantes -->
  <g filter="url(#sombra)">
    <rect x="760" y="90" width="120" height="70" rx="16" fill="#FBF8F3" transform="rotate(8 820 125)"/>
    <rect x="1440" y="700" width="110" height="110" rx="20" fill="#C9D8EE" transform="rotate(-10 1495 755)"/>
    <rect x="1460" y="725" width="70" height="60" rx="12" fill="#FBF8F3" transform="rotate(-10 1495 755)"/>
  </g>
  <circle cx="790" cy="780" r="18" fill="#F3C9CF"/>
  <circle cx="1540" cy="110" r="14" fill="#D8EB67"/>
  <path d="M700 820 q24 -34 48 0 t48 0" fill="none" stroke="#BBC97D" stroke-width="7" stroke-linecap="round"/>
</svg>
