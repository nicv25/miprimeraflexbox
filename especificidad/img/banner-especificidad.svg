<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F2EA"/>
      <stop offset="1" stop-color="#EEF0DE"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#464F23" flood-opacity=".18"/>
    </filter>
    <filter id="suave" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#fondo)"/>

  <!-- manchas de color -->
  <g filter="url(#suave)" opacity=".55">
    <circle cx="150" cy="110" r="150" fill="#D8EB67"/>
    <circle cx="1460" cy="100" r="150" fill="#F3C9CF"/>
    <circle cx="1400" cy="470" r="130" fill="#C9D8EE"/>
    <circle cx="240" cy="480" r="120" fill="#BBC97D"/>
    <circle cx="800" cy="530" r="150" fill="#F7DDB0"/>
  </g>

  <!-- puntos decorativos -->
  <g fill="#BBC97D" opacity=".7">
    <circle cx="560" cy="70" r="5"/><circle cx="590" cy="70" r="5"/><circle cx="620" cy="70" r="5"/>
    <circle cx="560" cy="100" r="5"/><circle cx="590" cy="100" r="5"/><circle cx="620" cy="100" r="5"/>
    <circle cx="980" cy="440" r="5"/><circle cx="1010" cy="440" r="5"/><circle cx="1040" cy="440" r="5"/>
    <circle cx="980" cy="470" r="5"/><circle cx="1010" cy="470" r="5"/><circle cx="1040" cy="470" r="5"/>
  </g>

  <!-- IZQUIERDA: marcador con tres paneles -->
  <g transform="translate(60 50) rotate(-4)" filter="url(#sombra)">
    <rect width="330" height="150" rx="26" fill="#262B0A"/>
    <rect x="24" y="24" width="84" height="102" rx="14" fill="#464F23"/>
    <rect x="123" y="24" width="84" height="102" rx="14" fill="#464F23"/>
    <rect x="222" y="24" width="84" height="102" rx="14" fill="#464F23"/>
    <rect x="24" y="24" width="84" height="8" rx="4" fill="#F3C9CF"/>
    <rect x="123" y="24" width="84" height="8" rx="4" fill="#D8EB67"/>
    <rect x="222" y="24" width="84" height="8" rx="4" fill="#C9D8EE"/>
    <!-- números en forma de barras (sin texto) -->
    <rect x="58" y="50" width="14" height="60" rx="7" fill="#F3C9CF"/>
    <rect x="145" y="50" width="40" height="12" rx="6" fill="#D8EB67"/>
    <rect x="173" y="50" width="12" height="30" rx="6" fill="#D8EB67"/>
    <rect x="145" y="74" width="40" height="12" rx="6" fill="#D8EB67"/>
    <rect x="145" y="74" width="12" height="36" rx="6" fill="#D8EB67"/>
    <rect x="145" y="98" width="40" height="12" rx="6" fill="#D8EB67"/>
    <rect x="257" y="50" width="14" height="60" rx="7" fill="#C9D8EE"/>
  </g>

  <!-- IZQUIERDA ABAJO: podio de tres niveles -->
  <g transform="translate(70 330)" filter="url(#sombra)">
    <rect x="0" y="80" width="100" height="90" rx="14" fill="#C9D8EE"/>
    <rect x="110" y="20" width="100" height="150" rx="14" fill="#F3C9CF"/>
    <rect x="220" y="55" width="100" height="115" rx="14" fill="#D8EB67"/>
    <circle cx="160" cy="70" r="20" fill="#FBF8F3"/>
    <path d="M150 70 l8 8 14 -16" fill="none" stroke="#464F23" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- CENTRO ABAJO: fichas de selector -->
  <g transform="translate(450 400) rotate(5)" filter="url(#sombra)">
    <rect width="270" height="76" rx="38" fill="#FBF8F3"/>
    <rect x="20" y="18" width="70" height="40" rx="20" fill="#F3C9CF"/>
    <rect x="100" y="18" width="70" height="40" rx="20" fill="#D8EB67"/>
    <rect x="180" y="18" width="70" height="40" rx="20" fill="#C9D8EE"/>
  </g>

  <!-- DERECHA ARRIBA: medalla -->
  <g transform="translate(1190 40)">
    <path d="M40 0 h40 l-20 70 Z" fill="#96A84A"/>
    <path d="M120 0 h40 l-40 70 Z" fill="#BBC97D"/>
    <g filter="url(#sombra)">
      <circle cx="100" cy="115" r="62" fill="#F7DDB0"/>
    </g>
    <circle cx="100" cy="115" r="44" fill="none" stroke="#FBF8F3" stroke-width="6"/>
    <path d="M100 88 l9 18 20 3 -14 14 3 20 -18 -9 -18 9 3 -20 -14 -14 20 -3 Z" fill="#FBF8F3"/>
  </g>

  <!-- DERECHA ABAJO: barras que crecen (ranking) -->
  <g transform="translate(1210 310) rotate(-4)" filter="url(#sombra)">
    <rect width="300" height="170" rx="28" fill="#FBF8F3"/>
    <rect x="30" y="112" width="44" height="34" rx="10" fill="#C9D8EE"/>
    <rect x="94" y="82" width="44" height="64" rx="10" fill="#D8EB67"/>
    <rect x="158" y="52" width="44" height="94" rx="10" fill="#F3C9CF"/>
    <rect x="222" y="24" width="44" height="122" rx="10" fill="#96A84A"/>
  </g>

  <!-- formas flotantes -->
  <circle cx="440" cy="90" r="16" fill="#F7DDB0"/>
  <circle cx="1130" cy="420" r="12" fill="#F3C9CF"/>
  <rect x="1500" y="250" width="34" height="34" rx="10" fill="#BBC97D" transform="rotate(18 1517 267)"/>
  <rect x="40" y="255" width="26" height="26" rx="8" fill="#C9D8EE" transform="rotate(-14 53 268)"/>
  <path d="M780 480 q20 -30 40 0 t40 0" fill="none" stroke="#96A84A" stroke-width="6" stroke-linecap="round"/>
  <path d="M690 50 q20 -26 40 0 t40 0" fill="none" stroke="#F3C9CF" stroke-width="6" stroke-linecap="round"/>
  <path d="M900 40 q20 -26 40 0 t40 0" fill="none" stroke="#BBC97D" stroke-width="6" stroke-linecap="round"/>
</svg>
