<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Nunito, 'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#464F23" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- tarjeta del selector -->
  <g filter="url(#sombra)">
    <rect x="20" y="20" width="600" height="160" rx="28" fill="#FBF8F3"/>
  </g>
  <text x="48" y="58" font-size="15" letter-spacing="3" fill="#7C8579" font-weight="700">EL SELECTOR</text>
  <g font-family="'Courier New', monospace" font-size="26" font-weight="700" fill="#262B0A">
    <rect x="44" y="80" width="108" height="46" rx="23" fill="#F3C9CF"/>
    <text x="60" y="112" textLength="76" lengthAdjust="spacingAndGlyphs">#menu</text>
    <rect x="162" y="80" width="124" height="46" rx="23" fill="#D8EB67"/>
    <text x="176" y="112" textLength="96" lengthAdjust="spacingAndGlyphs">.boton</text>
    <rect x="296" y="80" width="118" height="46" rx="23" fill="#D8EB67"/>
    <text x="310" y="112" textLength="90" lengthAdjust="spacingAndGlyphs">:hover</text>
    <rect x="424" y="80" width="52" height="46" rx="23" fill="#C9D8EE"/>
    <text x="442" y="112" textLength="16" lengthAdjust="spacingAndGlyphs">a</text>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="98" y="156" fill="#B5626E">id</text>
    <text x="289" y="156" fill="#637309">clase + pseudoclase</text>
    <text x="450" y="156" fill="#4F6D9A">etiqueta</text>
  </g>

  <!-- marcador -->
  <g filter="url(#sombra)">
    <rect x="20" y="204" width="600" height="196" rx="28" fill="#262B0A"/>
  </g>
  <text x="320" y="240" text-anchor="middle" font-size="15" letter-spacing="5" fill="#BBC97D" font-weight="700">MARCADOR</text>

  <rect x="70" y="258" width="150" height="112" rx="18" fill="#464F23"/>
  <rect x="70" y="258" width="150" height="8" rx="4" fill="#F3C9CF"/>
  <text x="145" y="330" text-anchor="middle" font-size="58" font-weight="700" fill="#F3C9CF">1</text>
  <text x="145" y="358" text-anchor="middle" font-size="13" letter-spacing="2" fill="#BBC97D">IDS</text>

  <rect x="245" y="258" width="150" height="112" rx="18" fill="#464F23"/>
  <rect x="245" y="258" width="150" height="8" rx="4" fill="#D8EB67"/>
  <text x="320" y="330" text-anchor="middle" font-size="58" font-weight="700" fill="#D8EB67">2</text>
  <text x="320" y="358" text-anchor="middle" font-size="13" letter-spacing="2" fill="#BBC97D">CLASES</text>

  <rect x="420" y="258" width="150" height="112" rx="18" fill="#464F23"/>
  <rect x="420" y="258" width="150" height="8" rx="4" fill="#C9D8EE"/>
  <text x="495" y="330" text-anchor="middle" font-size="58" font-weight="700" fill="#C9D8EE">1</text>
  <text x="495" y="358" text-anchor="middle" font-size="13" letter-spacing="2" fill="#BBC97D">ETIQUETAS</text>
</svg>
